name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install tools
        run: npm ci

      - name: Create the Android project
        run: npm run android:prepare

      - name: Build the APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Sign with your key (only if the KEYSTORE_BASE64 secret is set)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk MuscleMap.apk
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > musclemap.keystore
            "$BT/apksigner" sign --ks musclemap.keystore --ks-pass pass:musclemap --ks-key-alias musclemap --key-pass pass:musclemap MuscleMap.apk
            rm musclemap.keystore
            echo "Signed with your Muscle Map key."
          else
            echo "No KEYSTORE_BASE64 secret, so the APK keeps a temporary debug signature."
          fi
          "$BT/apksigner" verify --print-certs MuscleMap.apk | head -n 3

      - uses: actions/upload-artifact@v4
        with:
          name: MuscleMap-apk
          path: MuscleMap.apk

      - name: Publish to the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest MuscleMap.apk --title "Muscle Map for Android" --notes "Built from commit ${GITHUB_SHA::7}. Open this page on your phone, tap MuscleMap.apk, then open the download to install."
